name: 'Setup build environment'
description: 'JDK 25 (Temurin) and Gradle setup shared by all workflows. The repository must already be checked out.'

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache-jdk: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6