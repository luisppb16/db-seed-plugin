# NOTE: Day-to-day CI (push / PR) is handled by ci.yml.
# This workflow exists for on-demand/manual builds only.

name: Build (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build plugin
        run: ./gradlew clean buildPlugin
